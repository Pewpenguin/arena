name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "refusing to release from ${GITHUB_REF_TYPE} ${GITHUB_REF}" >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          manifest=$(awk '
            /^\[package\]/ { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && /^version = "/ {
              sub(/^version = "/, "")
              sub(/".*$/, "")
              print
              exit
            }
          ' Cargo.toml)
          if [ -z "${manifest}" ]; then
            echo "package version not found in Cargo.toml" >&2
            exit 1
          fi
          if [ "${version}" != "${manifest}" ]; then
            echo "tag ${tag} does not match Cargo.toml version ${manifest}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary_suffix: ""
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary_suffix: ".exe"
            archive_ext: zip
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            binary_suffix: ""
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-15
            binary_suffix: ""
            archive_ext: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          suffix="${BINARY_SUFFIX-}"
          asset="arena-v${VERSION}-${TARGET}${suffix}"
          archive="arena-v${VERSION}-${TARGET}.${ARCHIVE_EXT}"
          src="target/${TARGET}/release/arena${suffix}"
          test -f "${src}"
          mkdir -p dist/stage
          cp "${src}" "dist/stage/${asset}"
          cp README.md dist/stage/README.md
          if [ "${ARCHIVE_EXT}" = "zip" ]; then
            stage_win="$(cygpath -w "${PWD}/dist/stage")"
            archive_win="$(cygpath -w "${PWD}/dist/${archive}")"
            powershell.exe -NoProfile -Command "Set-Location -LiteralPath '${stage_win}'; Compress-Archive -Force -Path '${asset}','README.md' -DestinationPath '${archive_win}'"
          else
            tar -czf "dist/${archive}" -C dist/stage "${asset}" README.md
          fi
          cp "dist/stage/${asset}" "dist/${asset}"
          rm -rf dist/stage
          test -f "dist/${asset}"
          test -f "dist/${archive}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/arena-*
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "refusing to release from ${GITHUB_REF_TYPE} ${GITHUB_REF}" >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          cd artifacts
          files=(
            "arena-v${VERSION}-x86_64-unknown-linux-gnu"
            "arena-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "arena-v${VERSION}-x86_64-pc-windows-msvc.exe"
            "arena-v${VERSION}-x86_64-pc-windows-msvc.zip"
            "arena-v${VERSION}-x86_64-apple-darwin"
            "arena-v${VERSION}-x86_64-apple-darwin.tar.gz"
            "arena-v${VERSION}-aarch64-apple-darwin"
            "arena-v${VERSION}-aarch64-apple-darwin.tar.gz"
          )
          for file in "${files[@]}"; do
            test -f "${file}"
          done
          sha256sum "${files[@]}" | sort -k2 > SHA256SUMS.txt
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${files[@]}" SHA256SUMS.txt --clobber
          else
            gh release create "${tag}" "${files[@]}" SHA256SUMS.txt \
              --verify-tag \
              --title "${tag}" \
              --generate-notes
          fi
